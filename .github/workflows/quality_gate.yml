name: Quality Gate

# Runs on every PR event and posts (or updates) a single friendly comment
# summarising the results of all checks performed by `make check`.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    name: Run all quality checks
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------ setup
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve full Python version (for cache key)
        id: full-python-version
        run: |
          echo "version=$(python - <<'PY'
          import sys
          print('-'.join(str(v) for v in sys.version_info))
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Configure Poetry (in-project venv)
        run: python -m poetry config virtualenvs.in-project true

      - name: Restore venv cache
        uses: actions/cache@v5
        id: cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.full-python-version.outputs.version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Validate cached venv
        if: steps.cache.outputs.cache-hit == 'true'
        run: python -m poetry run pip --version >/dev/null 2>&1 || rm -rf .venv

      - name: Install system dependencies (lxml)
        run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt-dev

      - name: Install project dependencies
        run: python -m poetry install

      # ---------------------------------------------------------------- checks
      # Each step uses continue-on-error so every check always runs.
      # Output is tee'd to a file and read later to build the PR comment.
      # pipefail ensures the pipeline exits with the tool's exit code, not tee's.

      - name: Lint — ruff check
        id: ruff_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m poetry run ruff check . 2>&1 | tee /tmp/ruff_check.txt

      - name: Lint — ruff format
        id: ruff_format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m poetry run ruff format --check . 2>&1 | tee /tmp/ruff_format.txt

      - name: Lint — mypy (type checks)
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          MYPYPATH=typings python -m poetry run mypy findpapers tests/unit 2>&1 | tee /tmp/mypy.txt

      - name: Complexity — xenon
        id: complexity
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m poetry run xenon --max-absolute C --max-average B findpapers/ 2>&1 | tee /tmp/complexity.txt

      - name: Security — bandit (static analysis)
        id: bandit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m poetry run bandit -r findpapers/ -c pyproject.toml 2>&1 | tee /tmp/bandit.txt

      - name: Security — pip-audit (dependency vulnerabilities)
        id: pip_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m poetry run pip-audit --ignore-vuln PYSEC-2022-42969 2>&1 | tee /tmp/pip_audit.txt

      - name: Docstrings — interrogate
        id: docstrings
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m poetry run interrogate findpapers/ 2>&1 | tee /tmp/docstrings.txt

      - name: Dead code — vulture
        id: dead_code
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m poetry run vulture findpapers/ 2>&1 | tee /tmp/dead_code.txt

      - name: Tests & Coverage — pytest
        id: coverage
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m poetry run pytest --durations=3 -q \
            --cov="${PWD}/findpapers" \
            --cov-report=term-missing 2>&1 | tee /tmp/coverage.txt

      # ---------------------------------------------------- post PR comment
      - name: Post quality gate comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const MAX_OUTPUT_CHARS = 3000;

            // Read a captured output file, truncating if too long.
            function readOutput(path) {
              try {
                const raw = fs.readFileSync(path, 'utf8').trim();
                if (raw.length <= MAX_OUTPUT_CHARS) return raw;
                const half = Math.floor(MAX_OUTPUT_CHARS / 2);
                return (
                  raw.slice(0, half) +
                  '\n\n… (output truncated) …\n\n' +
                  raw.slice(-half)
                );
              } catch {
                return '(no output captured)';
              }
            }

            function statusBadge(outcome) {
              return outcome === 'success' ? '✅' : '❌';
            }

            // Map step id → outcome (values are injected by GitHub Actions before
            // the script runs, so these are plain strings at runtime).
            const outcomes = {
              ruff_check:  '${{ steps.ruff_check.outcome }}',
              ruff_format: '${{ steps.ruff_format.outcome }}',
              mypy:        '${{ steps.mypy.outcome }}',
              complexity:  '${{ steps.complexity.outcome }}',
              bandit:      '${{ steps.bandit.outcome }}',
              pip_audit:   '${{ steps.pip_audit.outcome }}',
              docstrings:  '${{ steps.docstrings.outcome }}',
              dead_code:   '${{ steps.dead_code.outcome }}',
              coverage:    '${{ steps.coverage.outcome }}',
            };

            const checks = [
              { id: 'ruff_check',  label: 'Lint',        tool: 'ruff check',       file: '/tmp/ruff_check.txt'  },
              { id: 'ruff_format', label: 'Format',      tool: 'ruff format',      file: '/tmp/ruff_format.txt' },
              { id: 'mypy',        label: 'Types',       tool: 'mypy',             file: '/tmp/mypy.txt'        },
              { id: 'complexity',  label: 'Complexity',  tool: 'xenon',            file: '/tmp/complexity.txt'  },
              { id: 'bandit',      label: 'Security',    tool: 'bandit',           file: '/tmp/bandit.txt'      },
              { id: 'pip_audit',   label: 'Deps audit',  tool: 'pip-audit',        file: '/tmp/pip_audit.txt'   },
              { id: 'docstrings',  label: 'Docstrings',  tool: 'interrogate',      file: '/tmp/docstrings.txt'  },
              { id: 'dead_code',   label: 'Dead code',   tool: 'vulture',          file: '/tmp/dead_code.txt'   },
              { id: 'coverage',    label: 'Tests & Cov', tool: 'pytest + cov',     file: '/tmp/coverage.txt'    },
            ];

            const allPassed = checks.every(c => outcomes[c.id] === 'success');
            const failedChecks = checks.filter(c => outcomes[c.id] !== 'success');

            // Build the header
            const headline = allPassed
              ? '## ✅ All quality checks passed — great work!'
              : `## ❌ ${failedChecks.length} quality check(s) need attention`;

            // Build the summary table
            let body = `${headline}\n\n`;
            body += '| Check | Tool | Result |\n';
            body += '|-------|------|--------|\n';
            for (const c of checks) {
              const badge = statusBadge(outcomes[c.id]);
              const result = outcomes[c.id] === 'success' ? 'passed' : '**failed**';
              body += `| ${c.label} | \`${c.tool}\` | ${badge} ${result} |\n`;
            }

            // Append collapsible details for every failed check
            if (failedChecks.length > 0) {
              body += '\n---\n\n### What needs fixing\n\n';
              for (const c of failedChecks) {
                const output = readOutput(c.file);
                body += `<details>\n`;
                body += `<summary>❌ <strong>${c.label}</strong> — <code>${c.tool}</code></summary>\n\n`;
                body += `\`\`\`\n${output}\n\`\`\`\n`;
                body += `</details>\n\n`;
              }
            }

            const sha = '${{ github.event.pull_request.head.sha }}';
            body += `\n---\n*Last updated for commit \`${sha.slice(0, 7)}\` · [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*\n`;

            // Use a hidden marker so we can find and update the comment on re-runs
            // instead of posting a new one every time.
            const MARKER = '<!-- findpapers-quality-gate -->';
            const fullBody = `${MARKER}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.startsWith(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
              core.info(`Updated existing quality gate comment (id ${existing.id})`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
              core.info('Created new quality gate comment');
            }
